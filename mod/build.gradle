plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"holdmyitems" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled Lua runtime. The jar in libs/ already carries the loom-generated
	// fabric.mod.json wrapper from the upstream build, so it is shipped verbatim
	// via src/main/resources/META-INF/jars + the "jars" entry in fabric.mod.json
	// (loom's include cannot nest plain file dependencies).
	implementation files("libs/luaj-jse-3.0.1.jar")
	compileOnly "com.terraformersmc:modmenu:20.0.3"
	localRuntime "com.terraformersmc:modmenu:20.0.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}
jar {
	exclude 'com/terraformersmc/**'
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
	exclude 'com/terraformersmc/**'
}


tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
